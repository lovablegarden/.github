name: CI Template

on:
  workflow_call:
    secrets:
      GH_PACKAGES_TOKEN:
        description: 'GitHub Packages token for accessing private packages'
        required: false
  
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Application
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
  
      - name: Debug GitHub Packages access
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          echo "=== GitHub Environment Debug ==="
          echo "GitHub Actor: $GITHUB_ACTOR"
          echo "GitHub Token: ${GH_PACKAGE_TOKEN:0:10}..."
          echo "Repository: ${{ github.repository }}"
          echo ""
          echo "=== Testing GitHub Packages Access ==="
          curl -H "Authorization: token $GH_PACKAGE_TOKEN" -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/orgs/gardentalkz/packages/maven/se.gardentalkz.api.gardentalkz-api-auth/versions" \
               || echo "Failed to access package versions"
          echo ""
          echo "=== Testing Maven Repository Access ==="
          curl -H "Authorization: token $GH_PACKAGE_TOKEN" \
               "https://maven.pkg.github.com/gardentalkz/gardentalkz-openapi-spec/se/gardentalkz/api/gardentalkz-api-auth/1.0.0/gardentalkz-api-auth-1.0.0.pom" \
               || echo "Failed to access Maven artifact"
  
      - name: Wait for lovablegarden-bom (if configured)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          if [ ! -f gradle.properties ] || ! grep -q '^lovablegardenBomVersion=' gradle.properties; then
            echo "No lovablegardenBomVersion in gradle.properties — skipping BOM wait"
            exit 0
          fi
          BOM_VERSION=$(grep '^lovablegardenBomVersion=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          POM_URL="https://maven.pkg.github.com/lovablegarden/lovablegarden-security-common/com/lovablegarden/lovablegarden-bom/${BOM_VERSION}/lovablegarden-bom-${BOM_VERSION}.pom"
          for attempt in $(seq 1 36); do
            if curl -fsSL -u "${GITHUB_ACTOR}:${GH_PACKAGE_TOKEN}" "$POM_URL" >/dev/null 2>&1; then
              echo "lovablegarden-bom ${BOM_VERSION} is available"
              exit 0
            fi
            echo "Waiting for lovablegarden-bom ${BOM_VERSION} (attempt ${attempt}/36)..."
            sleep 10
          done
          echo "Timed out waiting for lovablegarden-bom ${BOM_VERSION}"
          exit 1

      - name: Check API client versions come from the BOM
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          # Package retention only protects API client versions that a BOM pins
          # (LG-1378). A version declared in the service itself can be pruned and
          # break the build, so clients the BOM manages must be declared without one.
          if [ ! -f gradle.properties ] || ! grep -q '^lovablegardenBomVersion=' gradle.properties; then
            echo "No lovablegardenBomVersion in gradle.properties — skipping API client check"
            exit 0
          fi
          BOM_VERSION=$(grep '^lovablegardenBomVersion=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          POM="${RUNNER_TEMP}/lovablegarden-bom-${BOM_VERSION}.pom"
          curl -fsSL -u "${GITHUB_ACTOR}:${GH_PACKAGE_TOKEN}" -o "$POM" \
            "https://maven.pkg.github.com/lovablegarden/lovablegarden-security-common/com/lovablegarden/lovablegarden-bom/${BOM_VERSION}/lovablegarden-bom-${BOM_VERSION}.pom"

          # One artifactId per line: the se.lovablegarden.api clients this BOM pins
          export BOM_MANAGED_API_FILE="${RUNNER_TEMP}/bom-managed-api.txt"
          python3 - "$POM" > "$BOM_MANAGED_API_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          ns = {"m": root.tag[1:].split("}")[0]} if root.tag.startswith("{") else {"m": ""}
          p = "m:" if ns["m"] else ""
          for dep in root.findall(f"{p}dependencyManagement/{p}dependencies/{p}dependency", ns):
              if dep.findtext(p + "groupId", namespaces=ns) == "se.lovablegarden.api":
                  print(dep.findtext(p + "artifactId", namespaces=ns))
          PY
          echo "API clients managed by lovablegarden-bom ${BOM_VERSION}: $(paste -sd ' ' "$BOM_MANAGED_API_FILE")"
          [ -s "$BOM_MANAGED_API_FILE" ] || exit 0

          INIT="${RUNNER_TEMP}/bom-managed-api-check.gradle"
          cat > "$INIT" <<'GRADLE'
          def managed = new File(System.getenv('BOM_MANAGED_API_FILE')).readLines()*.trim().findAll { it } as Set
          gradle.projectsEvaluated { g ->
              def offending = []
              g.rootProject.allprojects { p ->
                  p.configurations.each { c ->
                      (c.dependencies.toList() + c.dependencyConstraints.toList()).each { d ->
                          if (d.group == 'se.lovablegarden.api' && managed.contains(d.name) && d.version) {
                              offending << "${p.displayName} (${c.name}): ${d.group}:${d.name}:${d.version}"
                          }
                      }
                  }
              }
              if (offending) {
                  throw new GradleException(
                      "These API clients are managed by lovablegarden-bom; remove the version so the BOM sets it " +
                      "(versions pinned outside the BOM get pruned by package retention, LG-1378):\n  " +
                      offending.unique().join('\n  '))
              }
          }
          GRADLE
          ./gradlew help --no-daemon -q -I "$INIT" > /dev/null
          echo "All BOM-managed API clients take their version from lovablegarden-bom ${BOM_VERSION}"

      - name: Build with Gradle
        env:
          CI: true
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          # Same-run handoff to publish; keep short to avoid Actions storage bloat
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    name: Publish Docker Image
    needs: [build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
  
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          # Main builds push only main-<sha> and latest. Semver tags come only from the release
          # workflow: gradle.properties `version=` is stale in every service, so tagging it here
          # overwrote old release images (plants:1.1.1 became a 1.1.4 main build, LG-1436).
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
  
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GH_PACKAGE_TOKEN=${{ secrets.GH_PACKAGES_TOKEN || github.token }}
