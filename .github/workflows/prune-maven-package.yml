name: Prune Maven package

on:
  workflow_call:
    inputs:
      package_name:
        description: 'Full Maven package name (e.g. com.lovablegarden.security.lovablegarden-security-common)'
        required: true
        type: string
      keep_count:
        description: 'Number of release versions to keep (-SNAPSHOT versions do not count; versions a BOM or a service build file pins are always kept)'
        required: false
        type: number
        default: 3
      dry_run:
        description: 'Log deletions without executing'
        required: false
        type: boolean
        default: true
      protect_versions:
        description: 'Comma-separated extra versions to never delete (e.g. current release)'
        required: false
        type: string
        default: ''
    secrets:
      LOVABLEGARDEN_BOT_PRIVATE_KEY:
        required: true
      LOVABLEGARDEN_BOT_APP_ID:
        required: false
      GH_PACKAGES_TOKEN:
        # PAT that can read maven.pkg.github.com and consumer repo contents (the
        # app token is rejected by the Maven registry). Required whenever there is
        # something to prune; without it the job fails before deleting anything.
        required: false
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Full Maven package name'
        required: true
        type: string
      keep_count:
        description: 'Number of release versions to keep (-SNAPSHOT versions do not count; versions a BOM or a service build file pins are always kept)'
        required: false
        type: number
        default: 3
      dry_run:
        description: 'Log deletions without executing'
        required: true
        type: boolean
        default: true
      protect_versions:
        description: 'Comma-separated extra versions to never delete'
        required: false
        type: string
        default: ''

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.LOVABLEGARDEN_BOT_APP_ID || secrets.LOVABLEGARDEN_BOT_APP_ID }}
          private-key: ${{ secrets.LOVABLEGARDEN_BOT_PRIVATE_KEY }}
          owner: lovablegarden
          permission-packages: write

      - name: Prune old Maven versions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # workflow_call: the caller's secret. workflow_dispatch: this repo's secret.
          PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          KEEP_COUNT: ${{ inputs.keep_count }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROTECT_VERSIONS: ${{ inputs.protect_versions }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit

          BOM_PACKAGE='com.lovablegarden.lovablegarden-bom'
          BOM_POM_BASE='https://maven.pkg.github.com/lovablegarden/lovablegarden-security-common/com/lovablegarden/lovablegarden-bom'
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          WORK=$(mktemp -d)

          fail() {
            echo "::error::$*"
            echo "Fail-closed: no versions deleted"
            exit 1
          }

          # All versions of a package as one JSON array (paginated)
          list_versions() {
            local pkg="$1" page=1 all='[]' resp count
            while true; do
              resp=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "/orgs/lovablegarden/packages/maven/${pkg}/versions?per_page=100&page=${page}")
              count=$(echo "$resp" | jq 'length')
              all=$(echo "$all $resp" | jq -s 'add')
              if [ "$count" -lt 100 ]; then
                break
              fi
              page=$((page + 1))
            done
            echo "$all"
          }

          ALL=$(list_versions "$PACKAGE_NAME")
          TOTAL=$(echo "$ALL" | jq 'length')
          echo "Found ${TOTAL} version(s) for ${PACKAGE_NAME}"

          # Semver versions, newest first. Non-semver names are never touched.
          SORTED=$(echo "$ALL" | jq -c --arg re "$SEMVER_RE" '
            [.[] | select(.name | test($re))]
            | sort_by(.created_at) | reverse
          ')
          SEMVER_COUNT=$(echo "$SORTED" | jq 'length')
          echo "Semver versions: ${SEMVER_COUNT}"

          # Only releases fill the keep window. -SNAPSHOT versions are mutable
          # and must not push releases out of it; they survive only if protected.
          # Returns the ids to keep for a given JSON array of protected names.
          keep_ids() {
            echo "$SORTED" | jq -c --argjson n "$KEEP_COUNT" --argjson protect "$1" '
              ( [ .[] | select(.name | endswith("-SNAPSHOT") | not) ][0:$n] | map(.id) ) as $recent
              | [ .[] | select(.name as $nm | $protect | index($nm)) | .id ] as $pinned
              | ($recent + $pinned) | unique
            '
          }

          INPUT_PROTECT=$(echo "$PROTECT_VERSIONS" | tr ',' '\n' | sed 's/[[:space:]]//g; s/^v//' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          CANDIDATES=$(echo "$SORTED" | jq -c --argjson keep "$(keep_ids "$INPUT_PROTECT")" '
            [ .[] | select(.id as $id | $keep | index($id) | not) ]
          ')
          if [ "$(echo "$CANDIDATES" | jq 'length')" -eq 0 ]; then
            echo "Nothing to prune (keep limit ${KEEP_COUNT}, protect: ${PROTECT_VERSIONS:-none})"
            exit 0
          fi

          # ---- Reference guard -------------------------------------------------
          # Before deleting anything, protect every version that a BOM still pins,
          # (for the BOM itself) every BOM version a consumer repo still uses, and
          # (for an API client) every version a repo's build files pin directly.
          # Any read failure aborts the job with nothing deleted.
          # The app token lists and deletes package versions; GH_PACKAGES_TOKEN
          # reads the Maven registry and consumer repos.
          [ -n "${PACKAGES_TOKEN:-}" ] || fail "GH_PACKAGES_TOKEN secret not provided; cannot verify references"
          : > "$WORK/protect.txt"
          echo "$INPUT_PROTECT" | jq -r '.[] | "\(.)\tprotect_versions input"' >> "$WORK/protect.txt"

          # 1) BOM POMs. Every existing BOM release is checked, not only the ones the
          #    BOM prune will keep: the prunes run in parallel, and a superset is safe.
          BOM_ALL=$(list_versions "$BOM_PACKAGE")
          BOM_VERSIONS=$(echo "$BOM_ALL" | jq -r --arg re "$SEMVER_RE" '.[] | .name | select(test($re))' | sort -u)
          [ -n "$BOM_VERSIONS" ] || fail "No ${BOM_PACKAGE} versions found; cannot verify references"

          for BV in $BOM_VERSIONS; do
            POM="$WORK/bom-${BV}.pom"
            CODE=$(curl -sS -L -o "$POM" -w '%{http_code}' -u "x-access-token:${PACKAGES_TOKEN}" \
              "${BOM_POM_BASE}/${BV}/lovablegarden-bom-${BV}.pom") \
              || fail "Could not download BOM ${BV} POM"
            if [ "$CODE" = "404" ]; then
              # Tolerate only a BOM version deleted meanwhile by the parallel BOM prune
              if list_versions "$BOM_PACKAGE" | jq -e --arg v "$BV" 'any(.[]; .name == $v)' > /dev/null; then
                fail "BOM ${BV} is listed but its POM returned 404"
              fi
              echo "BOM ${BV}: deleted since listing, skipped"
              continue
            fi
            [ "$CODE" = "200" ] || fail "BOM ${BV} POM returned HTTP ${CODE}"

            # Prints "<groupId>.<artifactId> <version>" per managed dependency
            REFS=$(python3 - "$POM" <<'PY'
          import re, sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          ns = {"m": root.tag[1:].split("}")[0]} if root.tag.startswith("{") else {"m": ""}
          p = "m:" if ns["m"] else ""

          def text(el, path):
              found = el.find(path, ns)
              return found.text.strip() if found is not None and found.text else None

          props = {"project.version": text(root, p + "version")}
          for prop in root.findall(p + "properties/*", ns):
              props[prop.tag.split("}")[-1]] = (prop.text or "").strip()

          def resolve(value):
              out = re.sub(r"\$\{([^}]+)\}", lambda m: props.get(m.group(1)) or m.group(0), value)
              if "${" in out:
                  sys.exit(f"unresolved property in {value!r}")
              return out

          deps = root.findall(f"{p}dependencyManagement/{p}dependencies/{p}dependency", ns)
          if not deps:
              sys.exit("no <dependencyManagement> dependencies found")
          for dep in deps:
              group, artifact, version = (text(dep, p + t) for t in ("groupId", "artifactId", "version"))
              if not (group and artifact and version):
                  sys.exit(f"incomplete dependency: {group}:{artifact}:{version}")
              # A timestamped snapshot (1.0.0-20260706.114839-8) lives in package version 1.0.0-SNAPSHOT
              version = re.sub(r"-\d{8}\.\d{6}-\d+$", "-SNAPSHOT", resolve(version))
              print(f"{resolve(group)}.{resolve(artifact)} {version}")
          PY
            ) || fail "Could not parse BOM ${BV} POM"

            echo "$REFS" | awk -v pkg="$PACKAGE_NAME" -v bv="$BV" \
              '$1 == pkg { print $2 "\tpinned by BOM " bv }' >> "$WORK/protect.txt"
          done

          # 2) Consumers of the BOM: lovablegarden-* repos whose default-branch
          #    gradle.properties sets lovablegardenBomVersion. The repo list comes
          #    from the app installation; each repo root must then be readable with
          #    GH_PACKAGES_TOKEN, so a repo it cannot see fails the job instead of
          #    looking like a non-consumer.
          #    Steps 2 and 3 share the repo list.
          API_GROUP='se.lovablegarden.api'
          REPOS=''
          if [ "$PACKAGE_NAME" = "$BOM_PACKAGE" ] || [[ "$PACKAGE_NAME" == "${API_GROUP}."* ]]; then
            REPOS=$(gh api --paginate "/orgs/lovablegarden/repos?per_page=100&type=all" \
              --jq '.[] | select(.archived | not) | select(.name | startswith("lovablegarden-")) | .name') \
              || fail "Could not list organisation repositories"
            [ -n "$REPOS" ] || fail "No lovablegarden-* repositories visible to the app token"
          fi

          if [ "$PACKAGE_NAME" = "$BOM_PACKAGE" ]; then
            SCANNED=0
            for REPO in $REPOS; do
              if ! ROOT=$(GH_TOKEN="$PACKAGES_TOKEN" gh api "repos/lovablegarden/${REPO}/contents/" \
                --jq '.[] | select(.type == "file") | .name' 2> "$WORK/err"); then
                grep -q 'This repository is empty' "$WORK/err" && continue
                cat "$WORK/err" >&2
                fail "Could not read ${REPO} with GH_PACKAGES_TOKEN"
              fi
              SCANNED=$((SCANNED + 1))
              grep -qxF gradle.properties <<< "$ROOT" || continue
              CONTENT=$(GH_TOKEN="$PACKAGES_TOKEN" gh api "repos/lovablegarden/${REPO}/contents/gradle.properties" \
                --jq '.content') || fail "Could not read ${REPO}/gradle.properties"
              BV=$(printf '%s' "$CONTENT" | base64 -d \
                | sed -n 's/^[[:space:]]*lovablegardenBomVersion[[:space:]]*[=:][[:space:]]*//p' \
                | tr -d '\r' | sed 's/[[:space:]]*$//' | tail -1) \
                || fail "Could not decode ${REPO}/gradle.properties"
              [ -n "$BV" ] || continue
              echo "$BV" | grep -qE "$SEMVER_RE" \
                || fail "${REPO}: lovablegardenBomVersion '${BV}' is not a plain version"
              printf '%s\tused by %s\n' "$BV" "$REPO" >> "$WORK/protect.txt"
            done
            echo "Scanned ${SCANNED} lovablegarden-* repositories for lovablegardenBomVersion"
          fi

          # 3) Direct pins of an API client: every version a lovablegarden-* repo's
          #    default branch sets for it in a Gradle build file or version catalog
          #    (e.g. 'se.lovablegarden.api:lovablegarden-api-tasks:5.2.0'). Text is
          #    scanned, so pins inside conditional blocks count; comments don't.
          #    Versions from gradle.properties, def/val/ext variables and catalog
          #    version refs are resolved; a version it cannot read fails the job.
          if [[ "$PACKAGE_NAME" == "${API_GROUP}."* ]]; then
            ARTIFACT=${PACKAGE_NAME#"${API_GROUP}."}
            SRC="$WORK/src"
            SCANNED=0
            for REPO in $REPOS; do
              if ! TREE=$(GH_TOKEN="$PACKAGES_TOKEN" gh api "repos/lovablegarden/${REPO}/git/trees/HEAD?recursive=1" \
                2> "$WORK/err"); then
                grep -q 'Git Repository is empty' "$WORK/err" && continue
                cat "$WORK/err" >&2
                fail "Could not read ${REPO} with GH_PACKAGES_TOKEN"
              fi
              SCANNED=$((SCANNED + 1))
              [ "$(echo "$TREE" | jq '.truncated')" = false ] || fail "${REPO}: file tree too large to list"
              BUILD_FILES=$(echo "$TREE" | jq -r '.tree[] | select(.type == "blob") | .path
                | select(test("(^|/)((build|settings)\\.gradle(\\.kts)?|gradle\\.properties|[^/]+\\.versions\\.toml)$"))')
              while IFS= read -r FILE; do
                [ -n "$FILE" ] || continue
                mkdir -p "$SRC/$REPO/$(dirname "$FILE")"
                CONTENT=$(GH_TOKEN="$PACKAGES_TOKEN" gh api "repos/lovablegarden/${REPO}/contents/${FILE}" \
                  --jq '.content') || fail "Could not read ${REPO}/${FILE}"
                printf '%s' "$CONTENT" | base64 -d > "$SRC/$REPO/$FILE" || fail "Could not decode ${REPO}/${FILE}"
              done <<< "$BUILD_FILES"
            done
            echo "Scanned ${SCANNED} lovablegarden-* repositories for direct ${ARTIFACT} pins"

            if [ -d "$SRC" ]; then
              # Prints "<version>\tpinned in <repo>/<file>:<line>" per direct pin
              cat > "$WORK/direct-pins.py" <<'PY'
          import re, sys
          from pathlib import Path

          group, artifact, src, semver = sys.argv[1], sys.argv[2], Path(sys.argv[3]), sys.argv[4]
          coord = re.escape(f"{group}:{artifact}")
          errors = []
          Q = "[\"']"

          def strip_comments(text):
              # Blank out comments but keep line numbers; "//" inside URLs is left alone
              text = re.sub(r"/\*.*?\*/", lambda m: re.sub(r"[^\n]", " ", m.group(0)), text, flags=re.S)
              return re.sub(r"(^|[\s;{}(])//[^\n]*", r"\1", text, flags=re.M)

          def props_file(path):
              props = {}
              for line in path.read_text(errors="replace").splitlines():
                  m = re.match(r"\s*([A-Za-z0-9_.-]+)\s*[=:]\s*(.*?)\s*$", line)
                  if m and not line.lstrip().startswith(("#", "!")):
                      props[m.group(1)] = m.group(2)
              return props

          def assignments(text):
              # def x = '1.0' / val x = "1.0" / ext.x = '1.0' / x = '1.0' (in ext { }) / set("x", "1.0")
              found = {}
              for m in re.finditer(rf"(?:\b(?:def|val|var|String)\s+|\bext\.|\bextra\.)?\b([A-Za-z_]\w*)\s*=\s*{Q}([^\"'$]+){Q}", text):
                  found.setdefault(m.group(1), m.group(2))
              for m in re.finditer(rf"\bset\(\s*{Q}(\w+){Q}\s*,\s*{Q}([^\"'$]+){Q}\s*\)", text):
                  found.setdefault(m.group(1), m.group(2))
              return found

          def resolve(value, lookup, where):
              def sub(m):
                  name = m.group(1) or m.group(2)
                  name = re.sub(r"^(?:project|rootProject)\.(?:ext\.)?", "", name)
                  if name in lookup:
                      return lookup[name]
                  errors.append(f"{where}: cannot resolve ${{{name}}} in {value!r}")
                  return m.group(0)
              out = re.sub(r"\$\{([\w.]+)\}|\$([A-Za-z_]\w*)", sub, value)
              out = re.sub(r"(@\w+|!!)$", "", out.strip())
              out = re.sub(r"-\d{8}\.\d{6}-\d+$", "-SNAPSHOT", out)
              if "$" not in out and not re.match(semver, out):
                  errors.append(f"{where}: {artifact} version {value!r} is not a plain version")
              return out

          def line_of(text, pos):
              return text.count("\n", 0, pos) + 1

          for repo_dir in sorted(p for p in src.iterdir() if p.is_dir()):
              repo = repo_dir.name
              files = sorted(p for p in repo_dir.rglob("*") if p.is_file())
              root_props = repo_dir / "gradle.properties"
              props = props_file(root_props) if root_props.exists() else {}
              catalog_versions = {}
              for f in files:
                  if f.name.endswith(".versions.toml"):
                      section = None
                      for line in f.read_text(errors="replace").splitlines():
                          m = re.match(r"\s*\[([^\]]+)\]", line)
                          if m:
                              section = m.group(1).strip()
                          elif section == "versions":
                              m = re.match(r'\s*([\w.-]+)\s*=\s*(?:"([^"]+)"|\{[^}]*?(?:strictly|require|prefer)\s*=\s*"([^"]+)")', line)
                              if m:
                                  catalog_versions[m.group(1)] = m.group(2) or m.group(3)

              for f in files:
                  rel = f"{repo}/{f.relative_to(repo_dir)}"
                  text = f.read_text(errors="replace")
                  pins = []  # (line, raw version, lookup)
                  if f.name.endswith(".versions.toml"):
                      for n, line in enumerate(text.splitlines(), 1):
                          line = re.sub(r"\s#.*$", "", line)
                          names_it = re.search(rf'"{coord}(?::([^"]*))?"', line) or (
                              re.search(rf'\bgroup\s*=\s*"{re.escape(group)}"', line)
                              and re.search(rf'\bname\s*=\s*"{re.escape(artifact)}"', line))
                          if not names_it:
                              continue
                          m = re.search(rf'"{coord}:([^"]+)"', line)
                          ref = re.search(r'version\.ref\s*=\s*"([^"]+)"|version\s*=\s*\{\s*ref\s*=\s*"([^"]+)"', line)
                          ver = re.search(r'version\s*=\s*(?:"([^"]+)"|\{[^}]*?(?:strictly|require|prefer)\s*=\s*"([^"]+)")', line)
                          if m:
                              pins.append((n, m.group(1), {}))
                          elif ref:
                              key = ref.group(1) or ref.group(2)
                              if key not in catalog_versions:
                                  errors.append(f"{rel}:{n}: version.ref {key!r} not in [versions]")
                              else:
                                  pins.append((n, catalog_versions[key], {}))
                          elif ver:
                              pins.append((n, ver.group(1) or ver.group(2), {}))
                          elif "version" in line:
                              errors.append(f"{rel}:{n}: cannot read the {artifact} version")
                  elif f.name == "gradle.properties":
                      continue
                  else:
                      code = strip_comments(text)
                      local = props_file(f.parent / "gradle.properties") if (f.parent / "gradle.properties").exists() else {}
                      lookup = {**props, **local, **assignments(code)}
                      for m in re.finditer(rf"{Q}{coord}:", code):
                          v = re.match(r"([^\"'\s]*)[\"']", code[m.end():])
                          if not v or not v.group(1):
                              errors.append(f"{rel}:{line_of(code, m.start())}: cannot read the {artifact} version")
                          else:
                              pins.append((line_of(code, m.start()), v.group(1), lookup))
                      # group: 'x', name: 'y', version: 'z' (Groovy map) / group = "x", name = "y", version = "z" (Kotlin)
                      for m in re.finditer(rf"\bgroup\s*[:=]\s*{Q}{re.escape(group)}{Q}\s*,\s*name\s*[:=]\s*{Q}{re.escape(artifact)}{Q}([^\n)]*)", code):
                          rest = m.group(1)
                          if not re.search(r"\bversion\s*[:=]", rest):
                              continue
                          v = re.search(rf"\bversion\s*[:=]\s*(?:{Q}([^\"']+){Q}|([A-Za-z_][\w.]*))", rest)
                          if not v:
                              errors.append(f"{rel}:{line_of(code, m.start())}: cannot read the {artifact} version")
                          else:
                              raw = v.group(1) if v.group(1) is not None else "${" + v.group(2) + "}"
                              pins.append((line_of(code, m.start()), raw, lookup))
                  for n, raw, lookup in pins:
                      version = resolve(raw, lookup, f"{rel}:{n}")
                      if "$" not in version and re.match(semver, version):
                          print(f"{version}\tpinned in {rel}:{n}")

          if errors:
              for e in errors:
                  print(f"::error::{e}", file=sys.stderr)
              sys.exit(1)
          PY
              python3 "$WORK/direct-pins.py" "$API_GROUP" "$ARTIFACT" "$SRC" "$SEMVER_RE" >> "$WORK/protect.txt" \
                || fail "Could not read every ${ARTIFACT} version pinned in a build file"
            fi
          fi

          if [ -s "$WORK/protect.txt" ]; then
            echo "Protected versions:"
            sort -u "$WORK/protect.txt" | sed 's/^/  /'
          fi
          PROTECT=$(cut -f1 "$WORK/protect.txt" | jq -R -s -c 'split("\n") | map(select(length > 0)) | unique')
          # ---------------------------------------------------------------------

          KEEP_IDS=$(keep_ids "$PROTECT")
          DELETE_IDS=$(echo "$SORTED" | jq -c --argjson keep "$KEEP_IDS" '
            [ .[] | select(.id as $id | $keep | index($id) | not) | .id ]
          ')

          DELETE_COUNT=$(echo "$DELETE_IDS" | jq 'length')
          echo "Versions to delete: ${DELETE_COUNT}"

          echo "$SORTED" | jq -r --argjson keep "$KEEP_IDS" '
            .[] | if (.id as $id | $keep | index($id)) then "KEEP  \(.name) (\(.id))" else "DELETE \(.name) (\(.id))" end
          '

          if [ "$DELETE_COUNT" -eq 0 ]; then
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run=true — no versions deleted"
            exit 0
          fi

          echo "$DELETE_IDS" | jq -r '.[]' | while read -r VID; do
            echo "Deleting version id ${VID}..."
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/orgs/lovablegarden/packages/maven/${PACKAGE_NAME}/versions/${VID}"
          done
