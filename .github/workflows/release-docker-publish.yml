name: Publish Docker on Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Release tag or version (e.g. v1.2.3 or 1.2.3)'
        required: true
        type: string
      prune_dry_run:
        description: 'When true, package retention only logs deletions'
        required: false
        type: boolean
        default: false
    secrets:
      GH_PACKAGES_TOKEN:
        description: 'GitHub Packages token'
        required: false
      LOVABLEGARDEN_BOT_PRIVATE_KEY:
        required: false
      LOVABLEGARDEN_BOT_APP_ID:
        required: false
    outputs:
      image:
        description: 'Published image repository, e.g. ghcr.io/lovablegarden/<repo> (LG-1220)'
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: 'Digest of the pushed release image (index), for release-provenance.yml (LG-1220)'
        value: ${{ jobs.publish.outputs.digest }}
      version:
        description: 'Normalized release version (x.y.z)'
        value: ${{ jobs.publish.outputs.version }}
      tag:
        description: 'Git tag the image was built from (LG-1469)'
        value: ${{ jobs.publish.outputs.tag }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      image: ghcr.io/${{ github.repository }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Resolve the release tag BEFORE checkout and build exactly that commit (LG-1469).
      # On a release event the input is the tag itself. On workflow_dispatch the run's own ref
      # is a branch (usually main HEAD), so checking out the default ref would publish
      # unreleased code under a release version.
      - name: Resolve release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RAW: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          VERSION=$(echo "$RAW" | sed 's/^v//' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' | tail -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse semver from: $RAW"
            exit 1
          fi
          TAG=""
          # The input as given first (release events pass tag_name), then the release-please
          # tag <repo>-v<version>, then v<version> and the bare version.
          for candidate in "$RAW" "${REPO_NAME}-v${VERSION}" "v${VERSION}" "${VERSION}"; do
            if gh api "repos/${REPO}/git/ref/tags/${candidate}" --silent 2>/dev/null; then
              TAG="$candidate"
              break
            fi
          done
          if [ -z "$TAG" ]; then
            echo "::error::No release tag found for '$RAW' (tried $RAW, ${REPO_NAME}-v${VERSION}, v${VERSION}, ${VERSION}). Nothing was built or pushed."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Docker release tag: $VERSION, built from git tag $TAG (input: $RAW)"

      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - name: Record built commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "Building $(git rev-parse HEAD) (tag $TAG; workflow ref $GITHUB_REF @ $GITHUB_SHA)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: wrapper

      - name: Wait for lovablegarden-bom (if configured)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          if [ ! -f gradle.properties ] || ! grep -q '^lovablegardenBomVersion=' gradle.properties; then
            echo "No lovablegardenBomVersion in gradle.properties — skipping BOM wait"
            exit 0
          fi
          BOM_VERSION=$(grep '^lovablegardenBomVersion=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          POM_URL="https://maven.pkg.github.com/lovablegarden/lovablegarden-security-common/com/lovablegarden/lovablegarden-bom/${BOM_VERSION}/lovablegarden-bom-${BOM_VERSION}.pom"
          for attempt in $(seq 1 36); do
            if curl -fsSL -u "${GITHUB_ACTOR}:${GH_PACKAGE_TOKEN}" "$POM_URL" >/dev/null 2>&1; then
              echo "lovablegarden-bom ${BOM_VERSION} is available"
              exit 0
            fi
            echo "Waiting for lovablegarden-bom ${BOM_VERSION} (attempt ${attempt}/36)..."
            sleep 10
          done
          echo "Timed out waiting for lovablegarden-bom ${BOM_VERSION}"
          exit 1

      - name: Build with Gradle
        env:
          CI: true
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
          GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      # Release image tags are immutable (LG-1471): never overwrite an existing version.
      # Re-running a failed provenance or bump job does not re-run this job; to republish,
      # release a new version instead.
      - name: Refuse to overwrite an existing release tag
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
        run: |
          if out=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "::error::$IMAGE already exists. Release image tags are immutable (LG-1471); nothing was pushed. Release a new version instead."
            exit 1
          fi
          if ! echo "$out" | grep -qiE 'not found|manifest unknown|name unknown'; then
            echo "::error::Could not check whether $IMAGE exists; refusing to push. Registry said: $out"
            exit 1
          fi
          echo "$IMAGE does not exist yet"

      - name: Build and push release Docker image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          # The release SBOM and signed provenance come from release-provenance.yml (LG-1220);
          # BuildKit's own provenance stays minimal.
          provenance: mode=min
          # Never pass tokens as build-args (they land in image history and max-mode
          # provenance). A Dockerfile that needs the packages token reads it with
          # RUN --mount=type=secret,id=GH_PACKAGE_TOKEN (LG-1468). No service Dockerfile does today.
          secrets: |
            GH_PACKAGE_TOKEN=${{ secrets.GH_PACKAGES_TOKEN || github.token }}

  prune-package:
    needs: [publish]
    permissions:
      packages: write
    uses: lovablegarden/.github/.github/workflows/prune-ghcr-package.yml@main
    with:
      image_name: ${{ github.event.repository.name }}
      protect_versions: ${{ needs.publish.outputs.version }}
      dry_run: ${{ inputs.prune_dry_run }}
      # A failed prune (e.g. a token without delete:packages) must not stop the release reaching
      # lovablegarden-system: callers chain bump-system-lock after this whole workflow (LG-1219).
      soft_fail: true
    secrets:
      LOVABLEGARDEN_BOT_APP_ID: ${{ secrets.LOVABLEGARDEN_BOT_APP_ID }}
      LOVABLEGARDEN_BOT_PRIVATE_KEY: ${{ secrets.LOVABLEGARDEN_BOT_PRIVATE_KEY }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
