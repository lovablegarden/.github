name: Bump lovablegardenBomVersion in consumers

on:
  workflow_call:
    inputs:
      bom_version:
        description: 'Released BOM/security-common version (with or without v prefix)'
        required: true
        type: string
    secrets:
      LOVABLEGARDEN_BOT_PRIVATE_KEY:
        required: true
      LOVABLEGARDEN_BOT_APP_ID:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - lovablegarden-plants
          - lovablegarden-gardendesk
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.LOVABLEGARDEN_BOT_APP_ID || secrets.LOVABLEGARDEN_BOT_APP_ID }}
          private-key: ${{ secrets.LOVABLEGARDEN_BOT_PRIVATE_KEY }}
          owner: lovablegarden

      - name: Checkout consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: lovablegarden/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: consumer

      - name: Update lovablegardenBomVersion
        working-directory: consumer
        run: |
          RAW="${{ inputs.bom_version }}"
          VERSION=$(echo "$RAW" | sed 's/^v//' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' | tail -1)
          if [ -z "$VERSION" ]; then
            echo "Could not parse semver from: $RAW"
            exit 1
          fi
          echo "BOM bump -> ${VERSION} (from ${RAW})"
          sed -i.bak "s/^lovablegardenBomVersion=.*/lovablegardenBomVersion=${VERSION}/" gradle.properties
          rm -f gradle.properties.bak
          git diff -- gradle.properties

      - name: Open PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: consumer
          branch: bump/bom-${{ inputs.bom_version }}-${{ matrix.repo }}
          title: "chore: bump lovablegardenBomVersion to ${{ inputs.bom_version }}"
          body: |
            Automated bump after `lovablegarden-security-common` / BOM release `${{ inputs.bom_version }}`.
          commit-message: "chore: bump lovablegardenBomVersion to ${{ inputs.bom_version }}"
