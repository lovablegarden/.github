# Self-hosted Renovate (LG-1217, decided 2026-11-13): runs here with the lovablegarden bot GitHub App,
# not the Mend-hosted app. Repos opt in with a renovate.json that extends github>lovablegarden/.github
# (preset: default.json, docs: docs/renovate.md).
#
# - Scheduled runs only happen when the org/repo variable RENOVATE_ENABLED is 'true'.
# - workflow_dispatch can run any time; dry_run=true (default) only logs what Renovate would do.
# - Only the repos in RENOVATE_REPOSITORIES are touched (pilot: lovablegarden-system and
#   lovablegarden-security-common). Repos without a renovate.json are skipped (requireConfig).
name: Renovate

on:
  schedule:
    # Hourly on weekdays; the preset's own schedule decides when PRs are opened.
    - cron: '17 * * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only log what would happen (no branches, PRs or issues)
        type: boolean
        default: true
      log_level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

env:
  RENOVATE_REPOSITORIES: >-
    lovablegarden/lovablegarden-system,
    lovablegarden/lovablegarden-security-common

jobs:
  renovate:
    if: github.event_name == 'workflow_dispatch' || vars.RENOVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.LOVABLEGARDEN_BOT_APP_ID || secrets.LOVABLEGARDEN_BOT_APP_ID }}
          private-key: ${{ secrets.LOVABLEGARDEN_BOT_PRIVATE_KEY }}
          owner: lovablegarden
          repositories: lovablegarden-system,lovablegarden-security-common,.github

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
        run: |
          docker run --rm \
            -e RENOVATE_TOKEN \
            -e RENOVATE_PLATFORM=github \
            -e RENOVATE_REPOSITORIES="$(echo "$RENOVATE_REPOSITORIES" | tr -d ' ')" \
            -e RENOVATE_ONBOARDING=false \
            -e RENOVATE_REQUIRE_CONFIG=required \
            -e RENOVATE_GIT_AUTHOR="lovablegarden-bot <lovablegarden-bot@users.noreply.github.com>" \
            -e RENOVATE_DRY_RUN="$DRY_RUN" \
            -e LOG_LEVEL="$LOG_LEVEL" \
            ghcr.io/renovatebot/renovate:41
